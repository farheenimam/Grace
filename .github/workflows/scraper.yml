name: HackTracker Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 feedparser lxml psycopg2-binary python-dotenv

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
          HACKEREARTH_API_KEY: ${{ secrets.HACKEREARTH_API_KEY }}
        run: python scraper_runner.py

      - name: Keep workflow alive (record last run)
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-scrape.txt
            git add .github/last-scrape.txt
            git diff --cached --quiet && exit 0
            git commit -m "chore: record last scrape run [skip ci]" >/dev/null
            git push && exit 0
            echo "Push rejected (attempt $i) — resetting to latest main and retrying..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "Could not push last-scrape.txt after 5 attempts — non-fatal, scraping itself already succeeded."
          exit 0
